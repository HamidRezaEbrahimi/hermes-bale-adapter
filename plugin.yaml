name: bale
label: Bale
kind: platform
version: 1.0.0
description: >
  Bale (بله) gateway adapter for Hermes Agent — Telegram Bot API-compatible fork.
  Connects to Bale via python-telegram-bot against https://tapi.bale.ai and relays
  messages between Bale chats/groups and the Hermes agent. Derived from the bundled
  Telegram adapter (threads/topics, streaming edits, native media, inline keyboards,
  slash commands, notification modes, mention gating, per-user/chat allowlists).
author: HamidRezaEbrahimi
homepage: https://github.com/HamidRezaEbrahimi/hermes-bale-adapter
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @BaleBotFather"
    prompt: "Bale bot token"
    url: "https://t.me/BaleBotFather"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: BALE_HOME_CHANNEL_NAME
    description: "Display name for the Bale home channel"
    prompt: "Home channel display name"
    password: false
